[package]
name = "parsip"
version = "0.1.0"
edition = "2024"
description = "A decentralized, high-speed, peer-to-peer file sharing application for local networks."
license = "MIT OR Apache-2.0"
repository = "https://github.com/tgenericx/parsip"
keywords = ["p2p", "file-sharing", "lan", "decentralized"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
daemonize = "0.5.0"
ed25519-dalek = "3.0.0"
hex = "0.4.3"
log = "0.4.33"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
simplelog = "0.12.2"
socket2 = { version = "0.6.5", features = ["all"] }
toml = "1.1.4"
